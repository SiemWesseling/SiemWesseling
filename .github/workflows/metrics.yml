name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:        # lets you trigger it manually too
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.habits.svg
          base: ""                      # skip the default profile card, render only this plugin
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph   # "classic" (div-based) or "graph" (smoother svg)
          plugin_habits_days: 14             # how many days back to look
          config_timezone: Europe/Amsterdam  # so your active-hours chart isn't in UTC
